<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HXH</title>

</head>

<body>
    <header>
        <h1>Robótica Educacional</h1>
        <p>Compartilhando conhecimentos sobre Robótica e tecnologia</p>
        <style>
        /* Estilos gerais do corpo da página */
        body {
            font-family: Arial, sans-serif; /* Define uma fonte mais moderna */
            margin: 0;
            background-color: #f4f4f9; /* Fundo levemente acinzentado */
        }

        /* Estilo do cabeçalho principal */
        header {
            background-color: #183C63; /* Azul escuro */
            color: #FFFFFF; /* Texto branco */
            text-align: center; /* Centraliza o texto */
            max-width: 1200px;
            margin: 0 auto; /* Centraliza o cabeçalho na tela */
            padding: 40px;
            border-radius: 0 0 10px 10px; /* Borda suavemente arredondada embaixo */
        }

        /* Área do conteúdo principal */
        main {
            background-color: #FFFFFF;
            color: #183C63;
            display: flex; /* Alinha a imagem e o texto lado a lado */
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 20px; /* Espaço entre a imagem e o conteúdo */
            border-radius: 8px; /* Arredonda os cantos do bloco */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Sombra leve para dar profundidade */
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover; /* Evita que a imagem distorça caso mude de tamanho */
            border-radius: 8px;
        }

        /* Destaque para o nome do autor */
        .artigo-autor {
            font-weight: bold;
            color: #555;
        }
    </style>
    </header>

    <main>
        <img src="download (2).jfif"
            alt="Explicação resumida sobre a Imagem escolhida, para as pessoas com dificuldades visuais.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Kaio Luan</p>
            <p>Boas-vindas! Aqui vou compartilhar curiosidades de Hunter X Hunter </p>
            <button>❤️<span>0</span></button>
            <button>👍 <span>0</span></button>
        </div>
    </main>

</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    });
</script>

</html>
